<style>
body{margin:0;min-height:100vh;text-align:center;background:linear-gradient(135deg,#f3e5ab,#d4af37,#8b4513)}
#g{transform:scale(1.5);transform-origin:top center}
.x{margin:0;padding:1rem;font:bold 3.5rem monospace;background:#ffffff40}
.p{margin:0;color:#709;font-size:10px}
.q{color:red;font-size:2rem;margin-top:3rem}
#c{font-size:1.5rem;font-weight:bold;min-height:2rem}
.m{font-weight:bold}
#t{font:bold 4rem monospace}
button{padding:.8rem;font-weight:bold}
[hidden]{display:none!important}
</style>
<script>
const challenges=[
"Do 10 push-ups",
"Draw a cat without lifting your pen",
"Find something older than you",
"Write your name with your opposite hand",
"Find 5 blue objects",
"Balance on one foot for 30 seconds",
"Name 10 countries",
"Do 15 jumping jacks",
"Make a paper airplane",
"Draw yourself in 60 seconds"
];
let timer;
let audio;
function b(){
let o=audio.createOscillator();
o.connect(audio.destination);
o.start();
o.stop(audio.currentTime+.3)
}
function RC() {
audio||(audio=new AudioContext);
audio.resume();
let rI = Math.floor(Math.random() * challenges.length);
let challenge = challenges[rI];
document.getElementById("d").hidden = false;
document.querySelector(".m").hidden=false;
c.textContent = challenge;
C();
}
function C() {
clearInterval(timer);
let timeLeft = 3;
let time = document.getElementById("t");
time.textContent = timeLeft;
timer = setInterval(() => {
timeLeft--;
time.textContent = timeLeft;
if (timeLeft === 0) {
document.getElementById("d").hidden = true;
clearInterval(timer);
b();
}
}, 1000);
}
function CC() {
clearInterval(timer);
document.getElementById("d").hidden = true;
let t = Number(localStorage.getItem("n")) || 0;
t++;
localStorage.setItem("n", t);
document.getElementById("n").textContent = t;
document.getElementById("t").textContent = "DONE!";
}
function SA(){
g.hidden = true;
a.hidden = false;
}
function SG(){
a.hidden = true;
g.hidden = false;
}
</script>
<div id="g">
<h1 class="x">One Minute</h1>
<p class="p">What all can you do in a Minute?</p>
<h2 class="q">Your Challenge</h2>
<p id="c"></p>
<p class="m" hidden>Time left: <span id="t"></span></p>
<button id="d" onclick="CC()" hidden>I Did It!</button>
<button onclick="RC()">Challenge Me!</button>
<br/>
<h2><span>Completed challenges: <span id="n">0</span>(for now)</span> </h2>
<button onclick="SA()">About</button>
</div>
<div id="a" hidden>
<h1>About</h1>
<ul>Relax & Breathe</ul>
<p>Press the "Challenge Me!" button</p>
<p>DO the challenge while the <strong>timer</strong> ticks</p>
<p>Press I did it before the beep to win.</p>
<button onclick="SG()">Back</button>
</div>
