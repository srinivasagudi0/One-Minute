<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneMinute Fun</title>
    <link rel="stylesheet" href="app.css">
</head>

<style>
    body {
    background: linear-gradient(135deg, #F3E5AB, #D4AF37, #C68B59, #8B4513);
    min-height: 100dvh;
    margin: 0;
    text-align: center;
    }

    .title1 {
        font-size: 3.5rem;
        margin: 0;
        padding: 1rem;
        font-family: 'Courier New', Courier, monospace;
        background-color: rgba(240, 255, 240, 0.241);
    }

    .caption {
        margin-top: 0;
        color: rgb(127, 9, 246);
        font-size: 10px;
    }

    .challenge-title {
        color: red;
        font-size: 2rem;
        margin-top: 3rem;
    }

    #challenge {
        font-size: 1.5rem;
        font-weight: bold;
        min-height: 2rem;
        margin: 1.5rem auto;
        max-width: 70%;
    }

    .timer {
        font-size: 1.2rem;
        font-weight: bold;
        margin: 1rem 0;
    }

    #timer {
        font-size: 4rem;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
    }

    button {
        margin: 1rem auto;
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        border: 2px solid black;
        border-radius: 8px;
        background: #fff4cf;
    }

    button:hover {
        transform: scale(1.05);
    }

    .completed {
        margin-top: 2rem;
        font-size: 1.3rem;
    }

    [hidden] {
        display: none !important;
    }
</style>

<body>
    <h1 class="title1">One Minute</h1>
    <a href="about.html">How to play</a>
    <p class="caption">What all can you do in a Minute?</p>
    

    <h2 class="challenge-title">Your Challenge</h2>
    <p id="challenge"></p>
    <p class="timer">Time left: <span id="timer"></span></p>
    <button id="done-btn" onclick="CompleteChallenge()" hidden>I Did It!</button>
    <div class="start-challenge">
    <button onclick="RandomChallenge()">Give me a challenge!</button>
    </div>
    <br/>
    <h2><span>Completed challenges: <span id="completed">0</span>(for now)</span> </h2>
    

    

    <script src="script.js"></script>
</body>

</html>
